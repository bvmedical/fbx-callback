<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>FBX: QuickBooks sign-in</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 560px; margin: 15vh auto; padding: 0 16px; color: #222; }
  a { color: #1f6f5c; }
  code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>FBX: QuickBooks sign-in</h1>
<p id="msg">Handing the sign-in to FBX on this PC…</p>
<p id="manual" hidden>If nothing happens, <a id="go" href="#">click here to finish in FBX</a>.
FBX must be waiting (<code>fbx qbo connect</code> running on this same PC).</p>
<script>
  // This page holds no secrets and stores nothing. Intuit sends the browser here after the QuickBooks sign-in
  // (Intuit only accepts https addresses for production keys); the page passes Intuit's one-time answer on to
  // FBX, which listens on this PC only (localhost:9753). The code is useless without FBX's client secret.
  // Source: github.com/bvmedical/fbx, docs/qbo-callback/index.html.
  (function () {
    var keep = ["code", "state", "realmId", "error", "error_description"];
    var inParams = new URLSearchParams(window.location.search);
    var out = new URLSearchParams();
    keep.forEach(function (k) { if (inParams.has(k)) out.set(k, inParams.get(k)); });
    if (!out.has("state") || (!out.has("code") && !out.has("error"))) {
      document.getElementById("msg").textContent = "This page only finishes a QuickBooks sign-in started by FBX. Nothing to do here.";
      return;
    }
    var target = "http://localhost:9753/qbo/callback?" + out.toString();
    document.getElementById("go").href = target;
    document.getElementById("manual").hidden = false;
    history.replaceState(null, "", window.location.pathname); // keep the code out of the browser history
    window.location.replace(target);
  })();
</script>
</body>
</html>
